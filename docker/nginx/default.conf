server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Front controller do Laravel: arquivos estáticos são servidos diretamente,
    # qualquer outra rota é encaminhada ao public/index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Encaminha os scripts PHP ao PHP-FPM do serviço "app".
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Bloqueia acesso a arquivos ocultos (exceto .well-known).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
