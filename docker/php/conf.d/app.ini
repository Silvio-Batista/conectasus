; Ajustes de PHP para a aplicação ConectaSUS (ambiente de desenvolvimento).
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
expose_php = Off

; OPcache habilitado, mas revalidando os arquivos a cada requisição
; para refletir imediatamente as alterações feitas no código montado por volume.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
