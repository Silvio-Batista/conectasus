name: conectasus

# As variáveis ${...} são lidas do arquivo .env na raiz do projeto (o mesmo usado pelo Laravel).
# Os valores padrão permitem subir o ambiente mesmo antes de criar o .env.

services:
  # PHP-FPM + Composer (código montado por volume para desenvolvimento)
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: conectasus-app
    container_name: conectasus-app
    restart: unless-stopped
    user: www-data
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      # O vendor do container fica em um volume nomeado (sistema de arquivos do Docker),
      # o que torna a aplicação muito mais rápida em hosts Windows/macOS.
      # Ele é populado com "docker compose exec app composer install".
      - vendor_data:/var/www/html/vendor
    environment:
      # Dentro do Docker a aplicação sempre fala com o serviço "db",
      # independentemente do DB_HOST configurado no .env para uso local.
      APP_URL: http://localhost:${APP_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-conectasus}
      DB_USERNAME: ${MYSQL_USER:-conectasus}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nginx servindo o diretório public/ e repassando PHP ao serviço "app"
  web:
    image: nginx:1.27-alpine
    container_name: conectasus-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      # Passa por Nginx -> PHP-FPM -> Laravel (rota /up)
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # MySQL 8 com volume persistente. A porta não é publicada por padrão.
  db:
    image: mysql:8.4
    container_name: conectasus-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-conectasus}
      MYSQL_USER: ${MYSQL_USER:-conectasus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    # Para acessar o banco com um cliente externo (ex.: DBeaver), descomente:
    # ports:
    #   - "127.0.0.1:3307:3306"
    healthcheck:
      # -h 127.0.0.1 força TCP, evitando falso positivo durante a inicialização do MySQL.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db_data:
  vendor_data:
